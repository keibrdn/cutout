<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutout</title>
<style>
  :root {
    --bg: #ecebe4;
    --card: rgba(250, 249, 245, 0.88);
    --ink: #2b2b29;
    --muted: #7b7b75;
    --line: rgba(0, 0, 0, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(160deg, #dfe6ee 0%, #ecebe4 45%, #d9dcc2 100%);
    color: var(--ink);
    font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
    display: flex;
  }
  #panel {
    width: 270px; flex: none; margin: 16px; padding: 18px 18px 22px;
    background: var(--card); border-radius: 18px; backdrop-filter: blur(12px);
    box-shadow: 0 2px 20px rgba(0,0,0,.08); overflow-y: auto; max-height: calc(100vh - 32px);
  }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 14px; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select, .filebtn {
    font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled), .filebtn:hover { background: #f4f3ee; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .thumb { width: 52px; height: 52px; padding: 0; overflow: hidden; border-radius: 10px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  label.slider { display: block; font-size: 13px; margin: 8px 0 0; }
  label.slider span { float: right; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--ink); }
  input[type=color] { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; padding: 0; background: none; cursor: pointer; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); padding: 0; }
  #hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin-top: 16px; }
  #stage { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 16px 16px 16px 0; }
  #wrap { position: relative; box-shadow: 0 6px 30px rgba(0,0,0,.18); }
  #wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #empty { color: var(--muted); }
  #download { width: 100%; margin-top: 10px; background: var(--ink); color: #fff; border-color: var(--ink); }
  #download:hover:not(:disabled) { background: #444; }
</style>
</head>
<body>
<div id="panel">
  <h1>Cutout</h1>

  <h2>Photo</h2>
  <div class="row">
    <label class="filebtn">Upload<input id="file" type="file" accept="image/*" hidden></label>
    <button class="thumb" data-stock="StockImages/stockImage1.jpg" title="Stock 1"><img src="StockImages/stockImage1.jpg" alt="Stock 1"></button>
    <button class="thumb" data-stock="StockImages/stockImage2.jpg" title="Stock 2"><img src="StockImages/stockImage2.jpg" alt="Stock 2"></button>
  </div>

  <h2>Paper side</h2>
  <div class="row" id="sides">
    <button data-side="top">Top</button>
    <button data-side="bottom">Bottom</button>
    <button data-side="left">Left</button>
    <button data-side="right">Right</button>
  </div>

  <h2>Paper</h2>
  <div class="row" id="swatches"></div>
  <div class="row" style="margin-top:8px"><input id="color" type="color" value="#efe6d0"> <span style="font-size:13px;color:var(--muted)">Color</span></div>
  <label class="slider">Noise <span id="noiseV"></span><input id="noise" type="range" min="0" max="100" value="55"></label>
  <label class="slider">Crinkle <span id="crinkleV"></span><input id="crinkle" type="range" min="0" max="100" value="30"></label>

  <h2>Cutout</h2>
  <div class="row"><button class="on" id="shapeBlob">Blob</button></div>
  <label class="slider">Size <span id="sizeV"></span><input id="size" type="range" min="4" max="30" value="10"></label>
  <div class="row" style="margin-top:10px">
    <button id="undo">Undo</button>
    <button id="reset">Reset</button>
  </div>

  <h2>Export</h2>
  <select id="exportSize" style="width:100%">
    <option value="original">Original size</option>
    <option value="story">IG Story (1080×1920)</option>
  </select>
  <button id="download">Download PNG</button>

  <p id="hint">Hover the paper and click to punch out a shape. The piece lands on the photo side at the matching spot, then drag it wherever you like.</p>
</div>

<div id="stage">
  <div id="empty">Choose a photo to begin.</div>
  <div id="wrap" hidden>
    <canvas id="main"></canvas>
    <canvas id="overlay"></canvas>
  </div>
</div>

<script src="src/shapes.js"></script>
<script src="src/app.js"></script>
</body>
</html>
